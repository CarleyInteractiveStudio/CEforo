<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GameDev Forum{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        .navbar {
            background-color: rgba(30, 30, 30, 0.8) !important;
            backdrop-filter: blur(10px);
        }
        .card, .list-group-item {
            background-color: #1e1e1e;
            border: 1px solid #333;
        }
        .list-group-item-action:hover {
            background-color: #282828;
        }
        .btn-primary {
            background-color: #6200ee;
            border-color: #6200ee;
        }
        .btn-primary:hover {
            background-color: #3700b3;
            border-color: #3700b3;
        }
        a { color: #bb86fc; }
        a:hover { color: #ffffff; }
        .sidebar-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'forum:home' %}">GameDev Forum</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Hola, {{ user.username }}
                            </a>
                            <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDropdown">
                                <li><form action="{% url 'logout' %}" method="post" class="d-inline"><button type="submit" class="dropdown-item">Cerrar Sesión</button></form></li>
                            </ul>
                        </li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Iniciar Sesión</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'forum:signup' %}">Registrarse</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="row">
            <!-- Columna principal de contenido -->
            <div class="col-md-9">
                {% block content %}{% endblock %}
            </div>

            <!-- Barra lateral derecha -->
            <div class="col-md-3">
                <div class="card sidebar-card">
                    <div class="card-header">
                        Secciones
                    </div>
                    <div class="list-group list-group-flush">
                        {% for category in all_categories %}
                            <a href="{% url 'forum:category_detail' category.id %}" class="list-group-item list-group-item-action">
                                {{ category.name }}
                            </a>
                        {% empty %}
                            <div class="list-group-item">No hay secciones.</div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
